name: formatting

on:
  pull_request:
    branches: [main]

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Test formatting
        run: (test -z $(go fmt ./...))  

      - name: Format code
        run: (go fmt ./...)
