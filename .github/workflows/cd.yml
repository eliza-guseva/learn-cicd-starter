name: cd

on:
  workflow_run:
    workflows: ["ci"]  # This should match the "name" field in your ci.yml
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.23.0"

    - name: Build
      run: (./scripts/buildprod.sh)

    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'
  
    - name: 'Use gcloud CLI'
      run: 'gcloud info'
    
    - name: 'Build in Google Cloud'
      run: 'gcloud builds submit --tag us-central1-docker.pkg.dev/notely-466310/notely-ar-repo/notely:latest .'

